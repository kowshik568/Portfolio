<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="60%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>

    <!-- Subtle Radial Glow on Abstract Visual -->
    <radialGradient id="blueGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3987FF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3987FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Linear Grid Gradient -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3987FF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#3987FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3987FF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#blueGlow)"/>

  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="none" stroke="#1D2C43" stroke-width="1"/>

  <!-- Minimal Abstract Subtle Background Grid Lines -->
  <g stroke="#1D2C43" stroke-width="0.75" stroke-dasharray="3 6" opacity="0.45">
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
  </g>

  <!-- Left: Content Container -->
  <g transform="translate(100, 0)">
    <!-- Top Tiny Status Pill -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="10" height="10" rx="5" fill="#3987FF" opacity="0.2"/>
      <circle cx="5" cy="5" r="3" fill="#3987FF"/>
      <text x="18" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9AA5B5" letter-spacing="1.5">
        BUILDING SOFTWARE &amp; EXPLORING AI
      </text>
    </g>

    <!-- Name: Understated & Confident -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#E8EDF5" letter-spacing="-0.5">
      Sai Kowshik
    </text>

    <!-- Subtitle: Clean & Readable -->
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#9AA5B5" letter-spacing="0.2">
      AI &amp; Full-Stack Developer
    </text>

    <!-- Academic Metadata Line -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9AA5B5" letter-spacing="0.3">
        Computer Science Engineering · Parul University · Class of 2027
      </text>
    </g>
  </g>

  <!-- Right: Abstract Subtle Geometric & Technology Art (Plenty of Negative Space) -->
  <g transform="translate(920, 160)">
    <!-- Concentric Technical Circles with Deep Negative Space -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1D2C43" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#111722" stroke-width="1"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#162846" stroke-width="1.25"/>

    <!-- Restrained Electric Blue Accent Arc -->
    <path d="M 0 -80 A 80 80 0 0 1 80 0" fill="none" stroke="#3987FF" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtle Minimalist Inner Dot & Node -->
    <circle cx="0" cy="0" r="4" fill="#3987FF"/>
    <circle cx="80" cy="0" r="3" fill="#3987FF" opacity="0.8"/>
    <circle cx="0" cy="-80" r="3" fill="#3987FF" opacity="0.8"/>

    <!-- Minimal Crosshair Marks -->
    <path d="M -15 0 L 15 0 M 0 -15 L 0 15" stroke="#3987FF" stroke-width="1" opacity="0.4"/>

    <!-- Tiny Technical Label -->
    <text x="0" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" fill="#9AA5B5" opacity="0.6" letter-spacing="2">
      SYS.DEV // 22.3°N
    </text>
  </g>
</svg>
